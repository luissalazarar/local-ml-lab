[project]
name = "local-ml-lab"
version = "1.0.4"
description = "Laboratorio ML local-first"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "defusedxml==0.7.1",
  "fastapi==0.116.1",
  "filelock==3.19.1",
  "httpx==0.28.1",
  "joblib==1.6.0",
  "matplotlib==3.10.6",
  "numpy==2.3.3",
  "openai==1.109.1",
  "openpyxl==3.1.5",
  "optuna==5.0.0",
  "pandas==2.3.2",
  "psutil==7.0.0",
  "pyarrow==21.0.0",
  "pypdf==6.0.0",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "redis==6.4.0",
  "reportlab==4.4.3",
  "rq==2.6.0",
  "scikit-learn==1.9.1",
  "scipy==1.16.2",
  "sqlalchemy==2.0.43",
  "uvicorn==0.35.0",
  "xlsxwriter==3.2.5",
  "statsmodels==0.14.5",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==6.2.1", "ruff==0.13.1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_ml_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
