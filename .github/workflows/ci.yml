name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_version.py

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.8.17
          enable-cache: true
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
      - run: python3 scripts/validate_static.py && python3 scripts/check_privacy.py

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm run test -- --run && npm run build
        working-directory: frontend

  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start isolated stack
        run: APP_PORT=33000 docker compose -p local-ml-lab-ci up --build -d
      - name: Wait for healthy services
        run: |
          for attempt in $(seq 1 60); do
            if [ "$(docker compose -p local-ml-lab-ci ps --status running --services | wc -l)" -eq 4 ] && curl -fsS http://localhost:33000/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p local-ml-lab-ci ps
          exit 1
      - name: Run product, cancellation and report smokes
        run: |
          APP_URL=http://localhost:33000 python3 scripts/smoke.py
          APP_URL=http://localhost:33000 python3 scripts/examples_smoke.py
          APP_URL=http://localhost:33000 python3 scripts/excel_smoke.py
          APP_URL=http://localhost:33000 python3 scripts/cancel_smoke.py
          docker compose -p local-ml-lab-ci exec -T worker python - < scripts/verify_reports.py
      - name: Prove durable recovery when the queue is unavailable
        run: |
          docker compose -p local-ml-lab-ci stop queue
          pending=$(APP_URL=http://localhost:33000 python3 scripts/recovery_smoke.py create)
          job_id=$(printf '%s' "$pending" | python3 -c 'import json,sys; print(json.load(sys.stdin)["job_id"])')
          docker compose -p local-ml-lab-ci start queue
          APP_URL=http://localhost:33000 python3 scripts/recovery_smoke.py check "$job_id"
      - name: Prove restart persistence
        run: |
          before=$(curl -fsS http://localhost:33000/api/v1/runs | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["items"]))')
          docker compose -p local-ml-lab-ci restart
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:33000/api/v1/health/ready >/dev/null; then break; fi
            sleep 2
          done
          after=$(curl -fsS http://localhost:33000/api/v1/runs | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["items"]))')
          test "$before" = "$after"
      - name: Logs on failure
        if: failure()
        run: docker compose -p local-ml-lab-ci logs --tail=300
      - name: Stop isolated stack
        if: always()
        run: docker compose -p local-ml-lab-ci down -v
