server {
  listen 8080;
  server_name localhost 127.0.0.1;
  root /usr/share/nginx/html;
  index index.html;
  # Leave room for multipart framing around the 200 MiB application limit.
  client_max_body_size 201m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $api_upstream http://api:8000;
  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
  # Hashed build artifacts can be cached permanently. The HTML shell must be
  # revalidated so an already-open localhost tab cannot keep an older bundle.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }
  location = /index.html {
    expires -1;
  }
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
